server:
  port: ${SERVER_PORT}

spring:
  application:
    name: user_service

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  config:
    import: file:.env[.properties]

  liquibase:
    changeLog: "classpath:/db/changelog/root.yaml"
    enabled: ${LIQUIBASE_ENABLED:false}